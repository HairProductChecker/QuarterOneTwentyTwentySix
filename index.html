<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Goal Spinner</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
  --bg:#2f3236;
  --card:#3f4247;
  --accent:#ff9500;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;
  background:var(--bg);
  color:#fff;
}

.container{
  max-width:640px;
  margin:auto;
  padding:20px;
  text-align:center;
}

h1{
  font-size:26px;
  margin-bottom:24px;
}

button{
  width:100%;
  background:var(--accent);
  color:#000;
  border:none;
  padding:16px;
  font-size:18px;
  border-radius:12px;
  cursor:pointer;
  margin-bottom:28px;
}

.slots{
  display:grid;
  gap:16px;
}

.slot{
  background:var(--card);
  border-radius:14px;
  padding:14px;
  text-align:left;
  overflow:hidden;
}

.slot-title{
  font-size:18px;
  font-weight:600;
  margin-bottom:10px;
}

.reel{
  height:88px;
  overflow:hidden;
  position:relative;
}

.reel-inner{
  position:absolute;
  top:0;
  left:0;
  right:0;
  transition:transform 1.2s cubic-bezier(.15,.85,.25,1);
}

.reel-item{
  height:88px;
  display:flex;
  align-items:center;
  white-space:pre-line;
  line-height:1.4;
  font-size:15px;
  padding-right:8px;
}
</style>
</head>

<body>

<div class="container">
  <h1>Goal Spinner</h1>
  <button id="spinButton">Spin for Focus</button>

  <div class="slots">
    <div class="slot">
      <div class="slot-title">Today</div>
      <div class="reel"><div id="today" class="reel-inner"></div></div>
    </div>

    <div class="slot">
      <div class="slot-title">This Week</div>
      <div class="reel"><div id="week" class="reel-inner"></div></div>
    </div>

    <div class="slot">
      <div class="slot-title">This Sprint</div>
      <div class="reel"><div id="sprint" class="reel-inner"></div></div>
    </div>

    <div class="slot">
      <div class="slot-title">This Month</div>
      <div class="reel"><div id="month" class="reel-inner"></div></div>
    </div>
  </div>
</div>

<script>
const PROXY_URL = "https://script.google.com/macros/s/AKfycbyDQH4t5itUdpe17FBcu7MdOYvreQA9ZHxy8-OGUcOvEKp2fx1A9vUpwVf-p_EqxMCX/exec";

/* ---------- DATA ---------- */
async function loadData(){
  const r = await fetch(PROXY_URL);
  return await r.json();
}

function computeSlots(data){
  const now=new Date();
  const todayStr=now.toISOString().split("T")[0];

  const meta={};
  data.Meta.forEach(r=>meta[r.Key]=r.Value);

  const sprintLen=parseInt(meta["Sprint Length (days)"]||14);
  const sprintStart=new Date(meta["Sprint Start Date"]);
  const sprintEnd=new Date(sprintStart);
  sprintEnd.setDate(sprintStart.getDate()+sprintLen);

  const monthEnd=new Date(now);
  monthEnd.setDate(now.getDate()+parseInt(meta["Month Lookahead (days)"]||31));

  const today=[];
  data.Daily_Routines.filter(r=>String(r.Active).toLowerCase()==="true")
    .forEach(r=>today.push(r.RoutineName));
  data.Tasks.filter(t=>t.DueDate===todayStr&&t.Status!=="Done")
    .forEach(t=>today.push(t.TaskName));
  data.Events.filter(e=>e.EventDate===todayStr)
    .forEach(e=>today.push("Event: "+e.EventName));

  const weekStart=new Date(now);
  weekStart.setDate(now.getDate()-now.getDay());
  const weekEnd=new Date(weekStart);
  weekEnd.setDate(weekStart.getDate()+6);

  const week=data.Tasks.filter(t=>{
    const d=new Date(t.DueDate);
    return d>=weekStart&&d<=weekEnd&&t.Status!=="Done";
  }).map(t=>t.TaskName);

  const sprint=data.Tasks.filter(t=>{
    const d=new Date(t.DueDate);
    return d>=sprintStart&&d<=sprintEnd&&t.Status!=="Done";
  }).map(t=>t.TaskName);

  const month=data.Events.filter(e=>{
    const d=new Date(e.EventDate);
    return d>=now&&d<=monthEnd;
  }).map(e=>`${e.EventName} (${e.EventDate})`);

  return {
    today: today.length?today.join("\n"):"Nothing urgent today",
    week: week.length?week.join("\n"):"On track this week",
    sprint: sprint.length?sprint.join("\n"):"Sprint is clear",
    month: month.length?month.join("\n"):"No upcoming events"
  };
}

/* ---------- SLOT ANIMATION ---------- */
function spinReel(el, finalText){
  el.innerHTML="";
  const fake=[
    "Thinking…","Loading…","Almost…","Aligning goals…","Centering focus…"
  ];

  fake.forEach(t=>{
    const d=document.createElement("div");
    d.className="reel-item";
    d.textContent=t;
    el.appendChild(d);
  });

  const final=document.createElement("div");
  final.className="reel-item";
  final.textContent=finalText;
  el.appendChild(final);

  el.style.transform="translateY(0)";
  requestAnimationFrame(()=>{
    const offset=(fake.length)*88;
    el.style.transform=`translateY(-${offset}px)`;
  });
}

/* ---------- CLICK ---------- */
document.getElementById("spinButton").onclick=async()=>{
  const data=await loadData();
  const slots=computeSlots(data);

  spinReel(today,slots.today);
  setTimeout(()=>spinReel(week,slots.week),120);
  setTimeout(()=>spinReel(sprint,slots.sprint),240);
  setTimeout(()=>spinReel(month,slots.month),360);
};
</script>

</body>
</html>
