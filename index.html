<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Focus Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --bg:#111218;
  --panel:#1e1f26;
  --panel-hover:#272830;
  --accent:#ff9500;
  --text:#f5f6f7;
  --muted:#a0a4aa;
  --shadow:rgba(0,0,0,0.6);
  --radius:20px;
  --spacing:24px;
  --font-primary:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:var(--font-primary);
  background:radial-gradient(1500px 800px at top,#1b1c22,#111218);
  color:var(--text);
  line-height:1.5;
}

.container{
  max-width:900px;
  margin:auto;
  padding:var(--spacing);
}

header{
  text-align:center;
  margin-bottom:var(--spacing);
  animation:fadeUp 1s ease forwards;
}

header h1{
  font-size:42px;
  font-weight:800;
  letter-spacing:1px;
  margin-bottom:6px;
}

header p{
  font-size:16px;
  color:var(--muted);
  letter-spacing:.5px;
}

button{
  width:100%;
  padding:18px;
  font-size:18px;
  font-weight:700;
  background:linear-gradient(135deg,var(--accent),#ffaa33);
  color:#111;
  border:none;
  border-radius:var(--radius);
  cursor:pointer;
  box-shadow:0 12px 40px var(--shadow);
  transition:transform .15s ease,box-shadow .15s ease;
  margin:32px 0;
}

button:hover{
  transform:scale(1.02);
  box-shadow:0 16px 48px var(--shadow);
}

button:active{
  transform:scale(.97);
  box-shadow:0 8px 24px var(--shadow);
}

.section{
  background:linear-gradient(180deg,var(--panel),var(--panel-hover));
  border-radius:var(--radius);
  padding:20px 24px;
  margin-bottom:24px;
  box-shadow:0 10px 24px var(--shadow);
  animation:fadeUp .9s ease forwards;
  transition:background .3s ease;
}

.section:hover{
  background:linear-gradient(180deg,var(--panel-hover),#2a2b36);
}

.section h2{
  font-size:20px;
  font-weight:600;
  margin-bottom:14px;
  letter-spacing:.5px;
  color:#fff;
}

.content{
  white-space:pre-line;
  font-size:15px;
  line-height:1.55;
  color:#e9eaec;
  display:flex;
  flex-wrap:wrap;
  gap:18px;
}

.goal-card{
  background:#2c2f34;
  padding:12px 14px;
  border-radius:16px;
  flex:1 1 calc(33% - 12px);
  min-width:220px;
  box-shadow:0 6px 18px rgba(0,0,0,0.5);
}

.goal-card h3{
  font-size:16px;
  font-weight:600;
  margin-bottom:6px;
}

.goal-card ul{
  margin-left:16px;
  padding-left:0;
  list-style-type:disc;
}

@keyframes fadeUp{
  0%{opacity:0;transform:translateY(20px)}
  100%{opacity:1;transform:translateY(0)}
}
</style>
</head>

<body>
<div class="container">
  <header>
    <h1>Your Focus Dashboard</h1>
    <p>Clear priorities. Calm momentum. Every day counts.</p>
  </header>

  <button id="spin">Refresh Focus</button>

  <div class="section">
    <h2>Today</h2>
    <div id="today" class="content"></div>
  </div>

  <div class="section">
    <h2>This Sprint</h2>
    <div id="thisSprint" class="content"></div>
  </div>

  <div class="section">
    <h2>Next Sprint</h2>
    <div id="nextSprint" class="content"></div>
  </div>

  <div class="section">
    <h2>This Month</h2>
    <div id="thisMonth" class="content"></div>
  </div>
</div>

<script>
const PROXY_URL = "https://script.google.com/macros/s/AKfycbxYisy3JMe8h9NcKgYv5y4F5dBWiYorlNSNIGlMasUlbJh0pIHGp7ekS1jB2LavHWYK/exec";

/* ---------- Helpers ---------- */
function nowLA() {
  return new Date(new Date().toLocaleString("en-US", { timeZone: "America/Los_Angeles" }));
}

function dateOnly(d) {
  return d.toISOString().split("T")[0];
}

/* ---------- Load Data ---------- */
async function loadData() {
  const r = await fetch(PROXY_URL);
  return await r.json();
}

/* ---------- Compute Display ---------- */
function compute(data) {
  const now = nowLA();
  const day = now.getDay();

  /* --- TODAY --- */
  const routine = data.Daily_Routines.find(r => {
    if (day >= 1 && day <= 4) return r["Type"] === "Weekday";
    return r["Type"] === "Weekend";
  });
  const todayText = routine ? routine["RoutineName"] : "No routine defined";

  /* --- THIS SPRINT --- */
  const currentSprint = data.Sprints.find(s => {
    const start = new Date(s["Start Date"]);
    const end = new Date(s["End Date"]);
    return now >= start && now <= end;
  });

  let thisSprintGoals = data.Goals.filter(g => g["Sprint"] === currentSprint?.["SprintName"]);

  const thisSprintCards = thisSprintGoals.map(g => {
    let card = `<div class="goal-card"><h3>${g["Goal Name"]}</h3>`;

    const tasks = data.Tasks.filter(t => t["Goal"] === g["Goal Name"] && t["Status"] !== "Done");
    if (tasks.length) {
      card += "<ul>" + tasks.map(t => `<li>${t["Task Name"]}</li>`).join("") + "</ul>";
    }

    const events = data.Events.filter(e => {
      const prep = new Date(e["Prep Start Date"]);
      return prep >= new Date(currentSprint["Start Date"]) && prep <= new Date(currentSprint["End Date"]);
    });
    if (events.length) {
      card += "<ul>" + events.map(e => `<li>Prep: ${e["Event Name"]} (${e["Prep Start Date"]})</li>`).join("") + "</ul>";
    }

    card += "</div>";
    return card;
  });

  /* --- NEXT SPRINT --- */
  const nextSprint = data.Sprints.find(s => new Date(s["Start Date"]) > now);
  const nextSprintGoals = data.Goals.filter(g => g["Sprint"] === nextSprint?.["SprintName"])
    .map(g => `<div class="goal-card"><h3>${g["Goal Name"]}</h3></div>`);

  /* --- THIS MONTH --- */
  const monthEnd = new Date(now);
  monthEnd.setDate(now.getDate() + 31);

  const monthGoals = data.Goals.filter(g => {
    const goalDate = new Date(g["Month"]);
    return goalDate >= now && goalDate <= monthEnd;
  }).map(g => `<div class="goal-card"><h3>${g["Goal Name"]}</h3></div>`);

  const monthEvents = data.Events.filter(e => {
    const d = new Date(e["Event Date"]);
    return d >= now && d <= monthEnd;
  }).map(e => `<div class="goal-card"><h3>📅 ${e["Event Name"]}</h3></div>`);

  return {
    today: todayText,
    thisSprint: thisSprintCards.join(""),
    nextSprint: nextSprintGoals.join(""),
    thisMonth: [...monthGoals, ...monthEvents].join("")
  };
}

/* ---------- UI ---------- */
document.getElementById("spin").onclick = async () => {
  const data = await loadData();
  const r = compute(data);

  document.getElementById("today").textContent = r.today;
  document.getElementById("thisSprint").innerHTML = r.thisSprint;
  document.getElementById("nextSprint").innerHTML = r.nextSprint;
  document.getElementById("thisMonth").innerHTML = r.thisMonth;
};
</script>
</body>
</html>
